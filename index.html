for(let k=0;k<n*2;k++){const a=Math.PI*k/n-Math.PI/2+(h%7)*.1,r=k%2?13+Math.max(0,v[3])/12:30;pts.push((50+r*Math.cos(a)).toFixed(1)+","+(50+r*Math.sin(a)).toFixed(1))}
return `<svg viewBox="0 0 100 100" width="${z}" height="${z}" style="flex:none"><defs><linearGradient id="g${h}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue} 70% 32%)"/><stop offset="1" stop-color="hsl(${(hue+50)%360} 60% 12%)"/></linearGradient></defs><${sh} fill="url(#g${h})" stroke="hsl(${hue} 80% 70%)" stroke-width="2"/><polygon points="${pts.join(" ")}" fill="hsl(${hue} 90% 80%)" opacity=".92"/><circle cx="50" cy="50" r="${6+Math.abs(v[10])/20}" fill="hsl(${hue} 60% 20%)"/></svg>`}
const e=encodeURIComponent,T=[["the economy should be planned or collectively owned","markets and private property should run the economy"],["power should be dispersed and individual liberty protected","a strong state and public order should come first"],["social norms should keep evolving and diversity be embraced","traditional customs and institutions deserve protection"],["loyalty should reach beyond borders to humanity at large","the nation's interests and identity come first"],["force should be avoided and peace pursued","military strength and decisive force are legitimate tools"],["growth and industry matter more than ecological limits","ecological limits should constrain the economy"],["society needs radical, rapid transformation","change should come gradually through existing institutions"],["technology should be restrained and simpler living valued","technology and fast innovation should be embraced"],["public life should be secular","religion should shape public life and morals"],["justice should aim at rehabilitation and root causes","crime deserves firm punishment"],["the individual comes before the group","the community and the collective good come before the individual"]];
const SRC=[[/Marx|Lenin|Stalin|Mao|Trotsk|Hoxha|Tito|Guevar|Castro|Council|Luxemb|Left Comm|Eurocomm|Syndical|Juche|Dengism|Revisionist|Utopian|Autonom|Situation|Chavis|Sankar|Sandin|Participatory|Fully Automated|Cybernetic|Liberation Theology|Eco-Social|Democratic Social|Christian Comm|Bundism|Islamic Social|Black Radical|Anti-Imperial|Decolonial/,"Marxists Internet Archive","marxists.org"],[/Anarch|Mutualism|Egoism|Communalism|Confederalism|Zapatis|Primitiv|Post-Left|Agorism|Voluntary|Left-Libert|Vegan/,"The Anarchist Library","theanarchistlibrary.org"],[/Capitalism|Libertarian|Objectivism|Minarch|Classical Lib|Monetar|Supply|Neoliberal|Thatcher|Reagan|Georg|Ordolib|Paleolib|Social Darwin|Cypherpunk|Voluntary|Technolibert/,"Library of Economics and Liberty","econlib.org"]];
const sd=n=>SRC.find(r=>r[0].test(n)),gs=(d,q)=>"https://www.google.com/search?q="+e("site:"+d+" "+q),A_=(h,t)=>`<a href="${h}" target="_blank" rel="noopener">${t}</a>`;
function plink(n,id){if(MX[n])return"https://www.marxists.org/"+MX[n]+"/";const s=sd(id||"");return s?gs(s[2],n):"https://www.britannica.com/search?query="+e(n)}
function thinkers(x){const f=FD[x.n],l=PP.filter(p=>p.id==x.n&&p.n!=f).map(p=>p.n);return f?[f,...l]:l}
function rd(x){const s=sd(x.n),t=thinkers(x);return `<p><small>Sources: ${s?A_(gs(s[2],x.n),s[1])+" · ":""}${A_("https://plato.stanford.edu/search/searcher.py?query="+e(x.n),"Stanford Encyclopedia of Philosophy")} · ${A_("https://www.britannica.com/search?query="+e(x.n),"Britannica")}</small></p>${t.length?`<p><small>Key thinkers: ${t.map(n=>A_(plink(n,x.n),n)).join(" · ")}</small></p>`:""}`}
function idc(x,m){const rel=I.filter(y=>y!=x).map(y=>({n:y.n,d:Math.hypot(...x.v.map((c,j)=>c-y.v[j]))})).sort((a,b)=>a.d-b.d).slice(0,3).map(o=>o.n),f=FD[x.n];
return `<details class="card id"><summary>${emb(x,44)}<b>${x.n}</b>${m!=null?`<span class="pct">${m}%</span>`:""}</summary><p>${x.ds}</p>${f?`<p><b>Founder or key figure:</b> ${f}</p>`:""}<div>${A.map((a,k)=>`<div class="ax"><b><span>${a[1]}</span><span>${a[0]}</span><span>${a[2]}</span></b>${tr(x.v[k],"var(--ac2)")}</div>`).join("")}</div><p><b>What it holds</b></p><ul>${A.map((a,k)=>Math.abs(x.v[k])>=25?`<li>${Math.abs(x.v[k])<60?"Leans toward the view that":"Firmly holds that"} ${T[k][x.v[k]<0?0:1]}.</li>`:"").join("")}</ul><p><b>Close to:</b> ${rel.join(", ")}</p>${rd(x)}</details>`}
function brow(q){const t=q.toLowerCase(),dn=ans.filter(v=>v!=null).length==Q.length,S=dn&&sc(1);let r=I.filter(x=>x.n.toLowerCase().includes(t)||x.ds.toLowerCase().includes(t)).map(x=>({x,m:dn?PC(Math.hypot(...x.v.map((c,j)=>c-S[j]))):null}));if(dn)r.sort((a,b)=>b.m-a.m);const p=t?PP.filter(x=>x.n.toLowerCase().includes(t)):[];
document.getElementById("sl").innerHTML=(p.length?`<h2>Thinkers</h2><div class="card">${p.slice(0,15).map(x=>`<div class="m"><span>${A_(plink(x.n,x.id),x.n)} <small>${[...x.c].map(k=>CAT[k]).join(", ")}</small></span><span><small>${x.id||""}</small></span></div>`).join("")}</div><h2>Ideologies</h2>`:"")+(r.map(o=>idc(o.x,o.m)).join("")||"<p>No match.</p>")}
function srch(){st="s";const dn=ans.filter(v=>v!=null).length==Q.length;$.innerHTML=`<h1>Ideology library</h1><p>${I.length} ideologies and ${PP.length} thinkers. Tap one to open it.${dn?" Percentages show how close you are to each.":" Take the test to see how close you are to each."}</p><input id="sq" placeholder="Search..." oninput="brow(this.value)"><div id="sl"></div>`;brow("");scrollTo(0,0);addNav()}

$.innerHTML=`<h1>Your top 5</h1>`+R.map((r,j)=>{const x=I.find(y=>y.n==r.n),V=x.v,ax=A.map((_,a)=>a),sh=ax.filter(a=>Math.abs(S[a])>=30&&S[a]*V[a]>0&&Math.abs(S[a]-V[a])<40).slice(0,3).map(a=>tier(S[a],A[a])),df=ax.sort((a,b)=>Math.abs(S[b]-V[b])-Math.abs(S[a]-V[a]))[0],f=FD[x.n];

function addNav(){const d=ans.filter(v=>v!=null).length==Q.length,T=d?[["r","Results","res()"],["t","Top 5","top5()"],["c","Compass","comp()"],["v","Values","vals()"],["s","Search","srch()"]]:[["h","Home","start()"],["s","Search","srch()"]];$.insertAdjacentHTML("afterbegin",`<nav class="nav">${T.map(([k,l,f])=>`<span class="tag${st==k?" on":""}" onclick="${f}">${l}</span>`).join("")}</nav>`)}
