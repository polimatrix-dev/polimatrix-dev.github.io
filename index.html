function books(k){st="b";let h;if(k==null){const a=I.find(x=>x.n==mt(sc(0),"iv")[0].n),b=I.find(x=>x.n==mt(sc(1),"v")[0].n);h=`<h2>For ${a.n} (ideal)</h2>${rec(a.iv).map(bl).join("")}<h2>For ${b.n} (pragmatic)</h2>${rec(b.v).map(bl).join("")}`}else{const x=I[k];h=`<h2>For ${x.n}</h2><p>${x.ds}</p>${rec(x.iv).map(bl).join("")}`}$.innerHTML=`<h1>Reading list</h1><p>Books closest to your ideology. Links open a catalog search.</p><div class="card">${h}</div><button class="p" onclick="${k==null?"res()":"browse()"}">Back</button>`;scrollTo(0,0)}
